spring:
  application:
    name: grammar-agent-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-expire: ${JWT_ACCESS_EXPIRE:900}
    refresh-expire: ${JWT_REFRESH_EXPIRE:2592000}
  learning:
    default-language-code: ${DEFAULT_LANGUAGE_CODE:en}
    daily-goal-xp: ${DAILY_GOAL_XP:30}
  content:
    import-enabled: ${CONTENT_IMPORT_ENABLED:true}
  ai-tutor:
    enabled: ${AI_TUTOR_ENABLED:false}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    temperature: ${AI_TEMPERATURE:0.3}
    max-tokens: ${AI_MAX_TOKENS:600}
